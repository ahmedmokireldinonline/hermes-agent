services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://hermes:hermes@postgres:5432/hermes
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: redis
      MOCK_LLM: ${MOCK_LLM:-true}
      MODEL_PROFILE: ${MODEL_PROFILE:-lite}
      API_KEYS: ${API_KEYS:-}
      WEBHOOK_ALLOW: ${WEBHOOK_ALLOW:-}
      SKILL_SOURCE_ALLOW: ${SKILL_SOURCE_ALLOW:-raw.githubusercontent.com,github.com,gitlab.com,huggingface.co}
      MAX_SKILL_BYTES: ${MAX_SKILL_BYTES:-200000}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-15000}
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hermes:hermes@postgres:5432/hermes
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: redis
      MOCK_LLM: ${MOCK_LLM:-true}
      MODEL_PROFILE: ${MODEL_PROFILE:-lite}
      SKILL_SOURCE_ALLOW: ${SKILL_SOURCE_ALLOW:-raw.githubusercontent.com,github.com,gitlab.com,huggingface.co}
      MAX_SKILL_BYTES: ${MAX_SKILL_BYTES:-200000}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-15000}
    depends_on: [postgres, redis]
    deploy:
      replicas: 1
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hermes:hermes@postgres:5432/hermes
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: redis
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-2}
      SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-90}
    depends_on: [postgres, redis]
  crawler:
    build: ./crawler
    environment:
      REDIS_URL: redis://redis:6379/0
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-4}
    depends_on: [redis]
volumes:
  pgdata:
